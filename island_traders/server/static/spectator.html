<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Island Traders — Spectator</title>
<style>
  :root {
    --bg:#0b1622; --panel:#12233a; --panel2:#0e1c2e; --border:#1f3a5a;
    --text:#dce8f5; --dim:#7e98b5; --heading:#eaf2fb; --accent:#39a0ff;
    --gold:#f1c40f; --green:#27ae60; --red:#e74c3c; --radius:10px;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  header {
    position:sticky; top:0; z-index:5; background:var(--panel2);
    border-bottom:1px solid var(--border); padding:.55rem .9rem;
    display:flex; gap:.6rem; align-items:center; flex-wrap:wrap;
  }
  header h1 { font-size:1rem; margin:0; color:var(--heading); font-weight:700; }
  header .tag { color:var(--gold); }
  header input, header button {
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:7px; padding:.32rem .5rem; font:inherit;
  }
  header input { width:130px; }
  header button { cursor:pointer; }
  header button.primary { background:var(--accent); color:#022; border-color:var(--accent); font-weight:700; }
  #status { margin-left:auto; color:var(--dim); font-size:.82rem; }
  #status.err { color:var(--red); }
  #status.ok { color:var(--green); }
  main { padding:.9rem; max-width:1100px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:.9rem; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:.8rem .9rem; }
  .card h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 .55rem; }
  .stat-row { display:flex; justify-content:space-between; padding:.15rem 0; border-bottom:1px dashed var(--border); }
  .stat-row:last-child { border-bottom:0; }
  .stat-row .v { color:var(--heading); font-variant-numeric:tabular-nums; }
  .big { font-size:1.4rem; color:var(--gold); font-weight:700; }
  .inv { display:flex; flex-wrap:wrap; gap:.4rem; }
  .chip { background:var(--panel2); border:1px solid var(--border); border-radius:20px; padding:.2rem .6rem; font-size:.85rem; }
  .chip b { color:var(--gold); }
  .blocked { color:var(--red); }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th,td { text-align:left; padding:.25rem .4rem; border-bottom:1px solid var(--border); }
  th { color:var(--dim); font-weight:600; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .muted { color:var(--dim); }
  .chat-ro-msg { font-size:.85rem; line-height:1.4; padding:.08rem 0; }
  ul.feed { list-style:none; margin:0; padding:0; max-height:260px; overflow:auto; }
  ul.feed li { padding:.2rem 0; border-bottom:1px solid var(--border); font-size:.84rem; color:var(--dim); }
  ul.feed li.log-mine { color:var(--text); }
  .span2 { grid-column:1/-1; }
  .ro-note { color:var(--dim); font-size:.78rem; margin:.2rem 0 .8rem; }
  .sub { color:var(--dim); font-size:.78rem; margin:.1rem 0 .45rem; }
  /* Event-log filter bar — mirrors the main dashboard's filters. */
  .lf-bar { display:flex; gap:.35rem; margin-bottom:.5rem; flex-wrap:wrap; }
  .lf-btn {
    background:var(--panel2); color:var(--dim); border:1px solid var(--border);
    border-radius:6px; padding:.18rem .55rem; font-size:.78rem; cursor:pointer;
  }
  .lf-btn.active { background:var(--accent); color:#022; border-color:var(--accent); font-weight:700; }
  .feed[data-filter="events"]   li:not([data-cat="event"]){ display:none; }
  .feed[data-filter="trades"]   li:not([data-cat="trade"]){ display:none; }
  .feed[data-filter="training"] li:not([data-cat="training"]){ display:none; }
  .feed[data-filter="mine"]     li:not(.log-mine){ display:none; }
  .badge-fail { color:var(--red); font-size:.78rem; }
  .badge-warr { color:var(--dim); font-size:.78rem; }
</style>
</head>
<body>
<header>
  <h1>🏝️ Spectator <span class="tag" id="hdr-phase"></span></h1>
  <input id="in-room" placeholder="room id or code" />
  <input id="in-player" placeholder="player id or name" />
  <input id="in-interval" type="number" min="1" value="3" style="width:60px" title="poll seconds" />
  <button id="btn-watch" class="primary">Watch</button>
  <button id="btn-stop">Stop</button>
  <span id="status">idle</span>
</header>
<main>
  <div class="ro-note">Read-only — this view polls game state and never sends actions, so it can't disturb the player (human or AI) holding the seat.</div>
  <div id="view"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const ORIGIN = window.location.origin;
let timer = null, playerId = null, playerWant = null;
let logFilter = (() => { try { return localStorage.getItem('it_spec_log_filter') || 'all'; } catch (e) { return 'all'; } })();

// Categorise a log line the same way the main dashboard does, so the
// spectator's Events/Trades/Training filters behave identically.
function logCat(text){
  if (/\[EVENT\]|\[WORKPLACE\]|Drought|Flood|Disaster|Outage|Collapse|Spill|Pandemic|Storm|⛈/i.test(text)) return 'event';
  if (/\[TRADE\]|\bsold\b|\bbought\b|\boffer\b|\bbid\b|\bdeal\b|accepted|counter-?offer/i.test(text)) return 'trade';
  if (/train|course|graduat|apprentic|university|faculty|tuition|enrol/i.test(text)) return 'training';
  return 'other';
}

function setLogFilter(f){
  logFilter = f;
  try { localStorage.setItem('it_spec_log_filter', f); } catch (e) {}
  const ul = $('spec-feed');
  if (ul) ul.dataset.filter = f;
  document.querySelectorAll('#log-filter-bar .lf-btn')
    .forEach(b => b.classList.toggle('active', b.dataset.f === f));
}

function qs() { return new URLSearchParams(window.location.search); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function setStatus(msg, cls){ const el=$('status'); el.textContent=msg; el.className=cls||''; }

async function fetchState(room, pid) {
  const url = `${ORIGIN}/api/rooms/${encodeURIComponent(room)}/state` +
              (pid ? `?player_id=${encodeURIComponent(pid)}` : '');
  const r = await fetch(url, { cache:'no-store' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// `roles` from the server is a comma-joined STRING (role_names() ), while
// `role_names` is the list of short names — handle either shape.
function rolesText(roles){ return Array.isArray(roles) ? roles.join(', ') : (roles==null ? '' : String(roles)); }

function findMe(state, want) {
  const players = state.players || [];
  const w = String(want||'').toLowerCase();
  // match by lobby_player_id, then name, then role (short name or display text)
  return players.find(p => String(p.lobby_player_id) === String(want))
      || players.find(p => (p.name||'').toLowerCase() === w)
      || players.find(p => Array.isArray(p.role_names) && p.role_names.some(r => String(r).toLowerCase() === w))
      || players.find(p => rolesText(p.roles).toLowerCase().includes(w))
      || null;
}

function renderMarket(market) {
  const rows = Object.entries(market || {})
    .filter(([,i]) => i && (i.ask_price!=null || i.bid_price!=null || i.formula_price!=null))
    .map(([res,i]) => {
      const buy = i.ask_price!=null ? `${i.ask_price} <span class="muted">×${i.ask_quantity||0}</span>` : `<span class="muted">~${i.formula_price ?? '—'}</span>`;
      const sell = i.bid_price!=null ? `${i.bid_price} <span class="muted">×${i.bid_quantity||0}</span>` : `<span class="muted">—</span>`;
      return `<tr><td>${esc(res)}</td><td class="num">${buy}</td><td class="num">${sell}</td></tr>`;
    }).join('');
  return rows ? `<table><tr><th>Resource</th><th style="text-align:right">Buy @ ask</th><th style="text-align:right">Sell @ bid</th></tr>${rows}</table>` : '<div class="muted">No market data.</div>';
}

function renderBlocked(me) {
  const hints = (me.decision_hints||[]).filter(h => h.tone==='blocked');
  if (!hints.length) return '<div class="muted">Nothing blocking production.</div>';
  return '<ul class="feed">' + hints.map(h =>
    `<li class="blocked">⛔ ${esc(h.title)} — <span class="muted">${esc(h.why||'')}</span></li>`).join('') + '</ul>';
}

function renderNeeds(barter, meName) {
  const needs = (barter && barter.needs || []).filter(n => n.player !== meName && (n.needs||[]).length);
  if (!needs.length) return '<div class="muted">No outstanding needs.</div>';
  return '<ul class="feed">' + needs.map(n =>
    `<li><b>${esc(n.player)}</b> <span class="muted">[${esc(rolesText(n.roles))}]</span> wants ${esc((n.needs||[]).join(', '))}</li>`).join('') + '</ul>';
}

function renderStaff(me) {
  const profs = Object.values(me.workforce_professions || {});
  const bands = me.workforce_bands || {};
  const bandLine = Object.entries(bands).filter(([, v]) => v)
    .map(([k, v]) => `${esc(k)} <b style="color:var(--heading)">${v}</b>`).join(' · ') || '—';
  if (!profs.length) {
    return `<div class="sub">Bands: ${bandLine}</div><div class="muted">No staff data.</div>`;
  }
  profs.sort((a, b) =>
    ((b.active || 0) + (b.training || 0)) - ((a.active || 0) + (a.training || 0))
    || String(a.label).localeCompare(String(b.label)));
  const rows = profs.map(p =>
    `<tr><td>${esc(p.label)}</td><td class="num">${p.active || 0}</td>` +
    `<td class="num">${p.training ? `<span class="muted">${p.training}</span>` : '—'}</td></tr>`).join('');
  return `<div class="sub">Bands: ${bandLine}</div>` +
    `<table><tr><th>Profession</th><th style="text-align:right">Working</th>` +
    `<th style="text-align:right">Training</th></tr>${rows}</table>`;
}

function renderTraining(me) {
  const pipe = me.training_pipeline || [];
  const queue = me.training_queue_order || [];
  const decisions = me.training_decisions || [];
  let html;
  if (pipe.length) {
    const rows = pipe.map(t => {
      const ret = t.return_year
        ? `Y${t.return_year} ${esc(t.return_season || '')}` +
          (t.seasons_remaining != null ? ` <span class="muted">(${t.seasons_remaining}s)</span>` : '')
        : '<span class="muted">—</span>';
      const status = esc(String(t.status || '').replace(/_/g, ' '));
      const blocked = t.blocker_reason
        ? `<div class="badge-fail">⚠ ${esc(t.blocker_reason)}</div>` : '';
      return `<tr><td>${t.worker_count}× ${esc(t.target_profession)}` +
        `<div class="muted" style="font-size:.78rem">via ${esc(t.educator_name || '?')}</div>${blocked}</td>` +
        `<td>${status}</td><td class="num">${ret}</td></tr>`;
    }).join('');
    html = `<table><tr><th>Cohort (assignment)</th><th>Status</th>` +
      `<th style="text-align:right">Returns</th></tr>${rows}</table>`;
  } else {
    html = '<div class="muted">No active training assignments.</div>';
  }
  if (queue.length) {
    html += '<h2 style="margin-top:.7rem">Pending queue (Educator)</h2><ul class="feed">' +
      queue.map(r => `<li>#${esc(r.batch_id)} ${esc(r.target_profession)} ` +
        `<span class="muted">from ${esc(r.requester_name)} · priority ${esc(r.priority)}` +
        `${r.dollops_offered != null ? ` · ${esc(r.dollops_offered)} Dp` : ''}</span></li>`).join('') + '</ul>';
  }
  if (decisions.length) {
    html += '<h2 style="margin-top:.7rem">Decisions / notices</h2><ul class="feed">' +
      decisions.map(x => `<li>#${esc(x.batch_id)} ${esc(x.n_workers)}× ${esc(x.target_profession)} — ` +
        `${esc(String(x.status || '').replace(/_/g, ' '))}` +
        `${x.decline_reason ? ` <span class="muted">(${esc(x.decline_reason)})</span>` : ''}</li>`).join('') + '</ul>';
  }
  return html;
}

function renderCapital(me) {
  const cap = me.capacity || {};
  const owned = cap.capital_owned || [];
  const transit = cap.capital_in_transit || [];
  const repairs = cap.capital_repair_in_progress || [];
  let html;
  if (owned.length) {
    const rows = owned.map(it => {
      const badges = [];
      if (it.failed) badges.push(`<span class="badge-fail">${it.failed} failed</span>`);
      if (it.warrantied) badges.push(`<span class="badge-warr">${it.warrantied} warr.</span>`);
      const b = badges.length ? ` ${badges.join(' ')}` : '';
      return `<tr><td>${esc(it.name)}${b}</td><td class="num">${it.count}</td></tr>`;
    }).join('');
    html = `<table><tr><th>Equipment</th><th style="text-align:right">Qty</th></tr>${rows}</table>`;
  } else {
    html = '<div class="muted">No equipment owned.</div>';
  }
  if (transit.length) {
    html += '<h2 style="margin-top:.8rem">On order</h2><ul class="feed">' +
      transit.map(it =>
        `<li>📦 ${esc(it.name || it.item_id)} — <span class="muted">arrives Y${it.arrival_year} ` +
        `${esc(it.arrival_season || '')}` +
        `${it.seasons_remaining != null ? ` (${it.seasons_remaining}s)` : ''}</span></li>`).join('') +
      '</ul>';
  }
  if (repairs.length) {
    html += '<h2 style="margin-top:.8rem">In repair</h2><ul class="feed">' +
      repairs.map(it =>
        `<li>🔧 ${esc(it.name || it.item_id)} — <span class="muted">ready Y${it.completion_year} ` +
        `${esc(it.completion_season || '')}` +
        `${it.seasons_remaining != null ? ` (${it.seasons_remaining}s)` : ''}</span></li>`).join('') +
      '</ul>';
  }
  const loans = me.loans_detail || [];
  const leases = me.leases_detail || [];
  if (loans.length) {
    const rows = loans.map(l => {
      const dir = l.role === 'borrower'
        ? `<span style="color:var(--red,#c0392b)">▼ Borrowed</span>`
        : `<span style="color:var(--green,#27ae60)">▲ Lent</span>`;
      const rate = l.interest_rate != null ? `${(l.interest_rate * 100).toFixed(1)}%` : '—';
      const mat = l.maturity_year
        ? `Y${l.maturity_year} ${esc(l.maturity_season || '')}` +
          (l.seasons_to_maturity != null ? ` <span class="muted">(${l.seasons_to_maturity}s)</span>` : '')
        : '—';
      return `<tr><td>${dir} <b>${esc(l.principal)}</b> Dp</td><td class="num">${rate}</td>` +
        `<td class="num">${mat}</td></tr>`;
    }).join('');
    html += '<h2 style="margin-top:.8rem">Capital orders — financing</h2>' +
      `<table><tr><th>Loan</th><th style="text-align:right">Rate</th>` +
      `<th style="text-align:right">Matures</th></tr>${rows}</table>`;
  }
  if (leases.length) {
    html += '<h2 style="margin-top:.8rem">Capital orders — leases</h2><ul class="feed">' +
      leases.map(l =>
        `<li>${l.role === 'lessee' ? '📄 Leasing' : '📄 Leasing out'} ${esc(l.item_name || l.item_id)} — ` +
        `<span class="muted">${esc(l.annual_payment)} Dp/yr · buyout ${esc(l.buyout_payment)} Dp` +
        `${l.seasons_to_next_payment != null ? ` · next in ${l.seasons_to_next_payment}s` : ''}</span></li>`
      ).join('') + '</ul>';
  }
  return html;
}

function renderSpecChat(state) {
  // Read-only: the public room channel + any channels the watched seat is in
  // (the server scopes state.chat to this viewer). AI remarks render normally.
  const chans = (state.chat || []).filter(c => c.is_room || (c.messages || []).length);
  if (!chans.length) return '<div class="muted">No chat yet.</div>';
  return chans.map(c => {
    const msgs = (c.messages || []).slice(-20).map(m => {
      const t = new Date((m.ts || 0) * 1000);
      const hhmm = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
      return `<div class="chat-ro-msg"><b>${esc(m.from)}</b> <span class="muted" style="font-size:.7rem">${hhmm}</span> ${esc(m.text)}</div>`;
    }).join('') || '<div class="muted">—</div>';
    return `<div style="margin-bottom:.55rem"><div style="font-weight:700">${c.is_room ? '🏛' : '🔒'} ${esc(c.topic)}</div>${msgs}</div>`;
  }).join('');
}

async function fetchLog(room) {
  // Full-game server log (plain text). 404 while the game hasn't started.
  const r = await fetch(`${ORIGIN}/api/rooms/${encodeURIComponent(room)}/log`,
                        { cache: 'no-store' });
  if (!r.ok) return '';
  return r.text();
}

// Walk the full game log and pull out the watched island's trade activity and
// the season events it saw. Attribution: `[AI] Name …` self-labels; a human's
// action lines follow a `--- Name (role) — actions this season ---` banner;
// `[EVENT] Name: …` labels inline. Best-effort — unrecognised lines are skipped.
function parseActivity(logText, meName) {
  const trades = { bids: [], offers: [], purchases: [], sales: [] };
  const events = [];
  const meLc = String(meName || '').toLowerCase();
  if (!logText || !meLc) return { trades, events };
  let season = '', actor = '';
  const seasonRe = /Year\s+(\d+)\s+[—-]+\s+(\w+)/;
  const bannerRe = /^-{2,}\s*(.+?)\s*\(.*?\)\s*[—-]+\s*actions this season/i;
  const verbRe = /\b(bought|sold|listed|bid for|proposed)\b(.*)$/i;
  for (const raw of logText.split('\n')) {
    const line = raw.replace(/\s+$/, '');
    let m;
    if ((m = line.match(seasonRe))) { season = `Y${m[1]} ${m[2]}`; actor = ''; continue; }
    if ((m = line.match(bannerRe))) { actor = m[1]; continue; }
    if ((m = line.match(/^\[EVENT\]\s*([^:]+):\s*(.+)$/))) {
      if (m[1].trim().toLowerCase() === meLc) events.push({ season, text: m[2].trim() });
      continue;
    }
    if (/^\[OUTAGE\]/i.test(line) && line.toLowerCase().includes(meLc)) {
      events.push({ season, text: line.replace(/^\[OUTAGE\]\s*/i, '').trim() });
      continue;
    }
    let who = null, body = null;
    const ai = line.match(/^\[AI\]\s*(.+?)\s+(?=bought|sold|listed|bid for|proposed)/i);
    if (ai) { who = ai[1]; body = line.slice(ai[0].length); }
    else if (actor) { who = actor; body = line.trim(); }
    if (!who || who.toLowerCase() !== meLc) continue;
    const vm = String(body).match(verbRe);
    if (!vm) continue;
    const verb = vm[1].toLowerCase();
    const entry = { season, text: String(body).trim() };
    if (verb === 'bid for') trades.bids.push(entry);
    else if (verb === 'listed' || verb === 'proposed') trades.offers.push(entry);
    else if (verb === 'bought') trades.purchases.push(entry);
    else if (verb === 'sold') trades.sales.push(entry);
  }
  return { trades, events };
}

function _actList(items, empty) {
  if (!items.length) return `<div class="muted">${empty}</div>`;
  return '<ul class="feed">' + items.slice(-40).reverse().map(e =>
    `<li>${e.season ? `<span class="muted">${esc(e.season)}</span> ` : ''}${esc(e.text)}</li>`
  ).join('') + '</ul>';
}

function renderTradeActivity(act) {
  const t = act.trades;
  if (!(t.bids.length + t.offers.length + t.purchases.length + t.sales.length)) {
    return '<div class="muted">No trades recorded yet.</div>';
  }
  return `
    <h2>Purchases <span class="muted">(${t.purchases.length})</span></h2>${_actList(t.purchases, 'None.')}
    <h2 style="margin-top:.7rem">Sales <span class="muted">(${t.sales.length})</span></h2>${_actList(t.sales, 'None.')}
    <h2 style="margin-top:.7rem">Offers / listings <span class="muted">(${t.offers.length})</span></h2>${_actList(t.offers, 'None.')}
    <h2 style="margin-top:.7rem">Bids <span class="muted">(${t.bids.length})</span></h2>${_actList(t.bids, 'None.')}`;
}

function renderEvents(act) {
  if (!act.events.length) return '<div class="muted">No season events recorded.</div>';
  return '<ul class="feed">' + act.events.slice().reverse().map(e =>
    `<li><span class="muted">${esc(e.season || '')}</span> ${esc(e.text)}</li>`
  ).join('') + '</ul>';
}

function render(state, me, activity) {
  activity = activity || { trades: { bids: [], offers: [], purchases: [], sales: [] }, events: [] };
  $('hdr-phase').textContent = `· Year ${state.year ?? '?'} ${state.season ?? ''} · ${state.status||''}${state.paused?' · ⏸ PAUSED':''}`;
  const inv = Object.entries(me.inventory || {}).filter(([,v])=>v)
    .map(([k,v])=>`<span class="chip">${esc(k)} <b>${v}</b></span>`).join('') || '<span class="muted">empty</span>';
  const meName = (me.name || '').toLowerCase();
  const meRoles = (me.role_names || []).map(r => String(r).toLowerCase());
  const log = (state.recent_log||[]).slice(-80).reverse().map(l => {
    const low = String(l).toLowerCase();
    const mine = (meName && low.includes(meName)) || meRoles.some(r => r && low.includes(r));
    return `<li data-cat="${logCat(l)}"${mine ? ' class="log-mine"' : ''}>${esc(l)}</li>`;
  }).join('') || '<li class="muted">No log yet.</li>';

  $('view').innerHTML = `
  <div class="grid">
    <div class="card">
      <h2>${esc(me.name)} — ${esc(rolesText(me.roles)||'no role')}</h2>
      <div class="stat-row"><span>Net worth</span><span class="v big">${me.net_worth ?? '—'} Dp</span></div>
      <div class="stat-row"><span>Treasury (island cash)</span><span class="v">${me.treasury ?? me.dollops ?? '—'} Dp</span></div>
      <div class="stat-row"><span>Personal cash</span><span class="v">${me.personal_cash ?? '—'} Dp</span></div>
      <div class="stat-row"><span>Wealth</span><span class="v">${me.wealth ?? '—'} Dp</span></div>
      <div class="stat-row"><span>Workforce active/total</span><span class="v">${me.workforce_active ?? '?'} / ${me.workforce_count ?? '?'}</span></div>
      <div class="stat-row"><span>Efficiency / capacity</span><span class="v">${me.workforce_efficiency ?? '?'}% / ${me.production_capacity ?? '?'}%</span></div>
    </div>
    <div class="card">
      <h2>Inventory</h2>
      <div class="inv">${inv}</div>
      <h2 style="margin-top:.8rem">Blocking production</h2>
      ${renderBlocked(me)}
    </div>
    <div class="card">
      <h2>Market (buy @ ask / sell @ bid)</h2>
      ${renderMarket(state.market)}
    </div>
    <div class="card">
      <h2>Other islands need (trade openings)</h2>
      ${renderNeeds(state.barter_market, me.name)}
    </div>
    <div class="card">
      <h2>Staff summary</h2>
      ${renderStaff(me)}
    </div>
    <div class="card">
      <h2>Training pipeline</h2>
      ${renderTraining(me)}
    </div>
    <div class="card">
      <h2>Capital equipment & orders</h2>
      ${renderCapital(me)}
    </div>
    <div class="card span2">
      <h2>Trade activity <span class="muted">(full game)</span></h2>
      ${renderTradeActivity(activity)}
    </div>
    <div class="card">
      <h2>Season events</h2>
      ${renderEvents(activity)}
    </div>
    <div class="card span2">
      <h2>💬 Chat (read-only)</h2>
      ${renderSpecChat(state)}
    </div>
    <div class="card span2">
      <h2>Recent activity</h2>
      <div class="lf-bar" id="log-filter-bar">
        <button class="lf-btn" data-f="all"      onclick="setLogFilter('all')">All</button>
        <button class="lf-btn" data-f="mine"     onclick="setLogFilter('mine')">This island</button>
        <button class="lf-btn" data-f="trades"   onclick="setLogFilter('trades')">Trades</button>
        <button class="lf-btn" data-f="events"   onclick="setLogFilter('events')">Events</button>
        <button class="lf-btn" data-f="training" onclick="setLogFilter('training')">Training</button>
      </div>
      <ul class="feed" id="spec-feed" data-filter="${esc(logFilter)}">${log}</ul>
    </div>
  </div>`;
  setLogFilter(logFilter);
}

let roomId = null;  // resolved internal room id (from a code or used as-is)

async function resolveRoomId(input) {
  // Accept either an internal room id or a share code. Try the read-only
  // by-code lookup first; if that 404s, the input is already a room id.
  try {
    const r = await fetch(
      `${ORIGIN}/api/rooms/by-code/${encodeURIComponent(input.toUpperCase())}`,
      { cache: 'no-store' });
    if (r.ok) { return (await r.json()).room_id; }
  } catch (_) {}
  return input;
}

async function tick() {
  if (!roomId) { roomId = await resolveRoomId($('in-room').value.trim()); }
  try {
    let state = await fetchState(roomId, playerId);
    let me = findMe(state, playerId || playerWant);
    // Resolve a name (or unknown id) to the real lobby_player_id, then refetch
    // with it so the server includes that island's private inventory.
    if (me && String(me.lobby_player_id) !== String(playerId)) {
      playerId = me.lobby_player_id;
      state = await fetchState(roomId, playerId);
      me = findMe(state, playerId);
    }
    if (!me) {
      const names = (state.players || []).map(p => p.name).join(', ');
      setStatus(`player "${playerWant}" not found. In room: ${names || '(none)'}`, 'err');
      return;
    }
    let activity = { trades: { bids: [], offers: [], purchases: [], sales: [] }, events: [] };
    try { activity = parseActivity(await fetchLog(roomId), me.name); } catch (_) {}
    render(state, me, activity);
    setStatus(`updated ${new Date().toLocaleTimeString()}`, 'ok');
  } catch (e) {
    // 404 here means the room exists but has no game state yet (not started),
    // or the room/code is wrong (resolveRoomId returned the raw input).
    const msg = String(e.message).includes('404')
      ? 'waiting for the game to start, or check the room id/code…'
      : `waiting… (${e.message})`;
    setStatus(msg, 'err');
  }
}

function start() {
  stop();
  const room = $('in-room').value.trim();
  playerWant = $('in-player').value.trim();
  playerId = null;
  roomId = null;
  if (!room || !playerWant) { setStatus('enter a room id or code, and a player', 'err'); return; }
  const secs = Math.max(1, parseInt($('in-interval').value, 10) || 3);
  const url = new URL(window.location);
  url.searchParams.set('room', room); url.searchParams.set('player', playerWant);
  url.searchParams.set('interval', secs); history.replaceState(null,'',url);
  setStatus('connecting…');
  tick();
  timer = setInterval(tick, secs*1000);
}
function stop(){ if (timer){ clearInterval(timer); timer=null; } setStatus('stopped'); }

$('btn-watch').onclick = start;
$('btn-stop').onclick = stop;

// Prefill from query params and auto-start.
(function init(){
  const p = qs();
  if (p.get('room')) $('in-room').value = p.get('room');
  if (p.get('player')) $('in-player').value = p.get('player');
  if (p.get('interval')) $('in-interval').value = p.get('interval');
  if (p.get('room') && p.get('player')) start();
})();
</script>
