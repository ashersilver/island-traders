# Event chart weights and effects per island role.
# Weights in each role must sum to 1.0.
# Tune these values via simulation to balance win rates across roles.

Farmer:
  events:
    - name: "Normal Harvest"
      weight: 0.57
      yield_modifier: 1.0
      productivity_bonus: 0
      outage: false
      damage_seasons: 0
      natural_disaster: false
      price_shock_resource: null
      price_shock_multiplier: 1.0
    - name: "Bumper Harvest"
      weight: 0.16
      yield_modifier: 1.8
      productivity_bonus: 2
      outage: false
      damage_seasons: 0
      natural_disaster: false
      price_shock_resource: null
      price_shock_multiplier: 1.0
    - name: "Drought"
      weight: 0.12
      yield_modifier: 0.4
      productivity_bonus: 0
      outage: false
      damage_seasons: 0
      natural_disaster: false
      price_shock_resource: "Food"
      price_shock_multiplier: 1.5
    - name: "Crop Failure"
      weight: 0.10
      yield_modifier: 0.0
      productivity_bonus: 0
      outage: true
      damage_seasons: 0
      natural_disaster: false
      price_shock_resource: "Food"
      price_shock_multiplier: 2.0
    - name: "Flood"
      weight: 0.05
      # Re-tiered 2026-05-27 from yield 0.0 + outage to yield 0.25 +
      # no outage.  Flood is the ONLY natural_disaster event that
      # cascades to every other island simultaneously — at the old
      # severity (full halt + damage cycle on origin, 50% cascade
      # elsewhere) a single late-game Flood was effectively
      # game-ending for the originating role and dragged everyone
      # else to half production for the same season.  See the
      # 2026-05-27 disaster-mitigation brief Fix 1.
      yield_modifier: 0.25
      productivity_bonus: 0
      outage: false
      damage_seasons: 1
      natural_disaster: true
      price_shock_resource: "Food"
      price_shock_multiplier: 1.8

