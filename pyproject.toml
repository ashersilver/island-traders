[project]
name = "island-traders"
# Last *tagged* package release. The running/dev version lives in
# island_traders/constants.py (APP_VERSION, e.g. 0.1.5-dev.YYYY-MM-DD.N) and is
# the canonical source for the /version endpoint. Bump this only when cutting a
# release. See requirements/release-process.md → "Versioning".
version = "0.1.4"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12.0", "wsproto>=1.2"]

[project.scripts]
island-traders = "island_traders.cli.session:main"
island-traders-agent = "island_traders.cli.agent_client:main"
island-traders-sim = "island_traders.simulation.runner:main"
island-traders-export = "island_traders.export.printables:main"
island-traders-server = "island_traders.server.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["island_traders*"]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
